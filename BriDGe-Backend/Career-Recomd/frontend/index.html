<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Recommendation</title>
    <meta name="description" content="Discover your next career move and learning path in seconds.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="container">
        <header class="header">
            <h1 class="main-title">AI Career Recommendations</h1>
            <p class="subtitle">Discover your next career move and learning path in seconds.</p>
        </header>

        <section class="form-container">
            <form id="recommendation-form">
                
                <div class="form-group">
                    <label for="resume_text">Paste Your Resume (or text)</label>
                    <textarea id="resume_text" placeholder="I have 3 years of experience in Python, specialized in FastAPI and Pandas..." rows="5"></textarea>
                </div>

                <div class="form-group">
                    <label for="manual_skills">Manual Skills (comma-separated)</label>
                    <input type="text" id="manual_skills" placeholder="e.g. React, Node.js, AWS">
                </div>

                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="target_role">Target Role (Optional)</label>
                        <input type="text" id="target_role" placeholder="e.g. Data Scientist">
                    </div>

                    <div class="form-group half-width">
                        <label for="experience_level">Experience Level</label>
                        <select id="experience_level">
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="primary-btn">
                    <span class="btn-text">Generate Roadmap & Recommendations</span>
                </button>
                
                <div id="error-message" class="error-message hidden"></div>
            </form>
        </section>

        <!-- Loading State -->
        <div id="loading-state" class="loading-state hidden">
            <div class="spinner"></div>
            <p>Analyzing profile and generating your custom roadmap...</p>
        </div>

        <!-- Results Section -->
        <section id="results-container" class="results-container hidden fade-in">
            <div class="results-top-row">
                <!-- Roles Overview -->
                <div class="result-card">
                    <div class="card-header">
                        <h2>Recommended Roles</h2>
                    </div>
                    <div id="roles-grid" class="roles-list"></div>
                </div>

                <!-- Skill Gaps -->
                <div class="result-card">
                    <div class="card-header">
                        <h2>Skill Analysis</h2>
                    </div>
                    <div class="gaps-section">
                        <div id="optional-gaps" class="tags-container mb-3"></div>
                        <h4 class="gap-title">Critical Gaps</h4>
                        <div id="critical-gaps" class="tags-container"></div>
                    </div>
                </div>
            </div>

            <!-- Roadmap -->
            <div class="result-card">
                <div class="card-header">
                    <h2>Learning Roadmap</h2>
                </div>
                <div class="roadmap-content timeline" id="roadmap-content"></div>
            </div>

            <!-- Courses -->
            <div class="result-card">
                <div class="card-header">
                    <h2>Free Recommended Courses</h2>
                </div>
                <div id="courses-list" class="courses-list"></div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
